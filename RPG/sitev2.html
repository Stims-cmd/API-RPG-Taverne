<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta name="viewport">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/static/stylev2.css">
        <title>RPG-API</title>
    </head>
    <body>
        <div id="screenStart" class="screenStart">
            <h1>Choisis ton prénom : </h1>
            <span class="Startbutton">
                <input type="text" id="Name" placeholder="Simon" required>
                <button onclick="startGame()" id="StartButton">GO !</button>
            </span>
        </div>
        <div id="QuestScreen" class="QuestScreen">
            <button onclick="RandomQuest()" id="random_quete">Voir une quête</button>
            <p id="aff_quest"> ??? </p>
        </div>
        <script>
            function startGame(){
                const name = document.getElementById("Name").value || "Simon";
                document.getElementById("StartButton").style.display = "none";
                document.getElementById("screenStart").style.display = "none";
                document.getElementById("QuestScreen").style.display = "grid";
            }
            function RandomQuest(){
                fetch("/quests")
                    .then(response => response.json())
                    .then(data => {
                        console.log("Quête reçue :", data);
                        const quest = data[0]; // première ligne
                        document.getElementById("aff_quest").innerText = quest.title + " : " + quest.description;
                    })
                    .catch(error => {
                        console.error("Erreur lors de l'appel à /quests :", error);
                    });
            }

        </script>
    </body>
</html>
